# Dependabot ouvre chaque semaine des pull requests de mise à jour ; la CI les
# teste comme n'importe quelle autre.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      outils:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Un changement de version majeure de la base de données se décide et se
      # teste à la main (compatibilité PrestaShop, migration des données).
      - dependency-name: mysql
        update-types: ['version-update:semver-major']
