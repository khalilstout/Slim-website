# Dependabot ouvre chaque semaine des pull requests de mise à jour ; la CI les
# teste comme n'importe quelle autre. Il ouvre aussi, hors calendrier, une pull
# request dès qu'une faille est publiée sur une dépendance.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      outils:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
